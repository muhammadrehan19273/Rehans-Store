<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin — Rehan's Store</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f3ee;--ink:#111113;--muted:#6b6b72;--line:#e4dfd6;--acc:#ff4d1c;--ok:#12a150;--warn:#e8a200;--blue:#2b6bff;--ease:cubic-bezier(.22,1,.36,1)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
button{font-family:inherit;cursor:pointer;border:0}
h1,h2{font-family:'Playfair Display',serif}
.hide{display:none!important}

/* Login */
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
.lbox{width:min(420px,100%);background:#fff;border:1px solid var(--line);border-radius:28px;padding:38px;animation:up .7s var(--ease)}
@keyframes up{from{opacity:0;transform:translateY(30px)}}
.lbox h1{font-size:2rem;margin-bottom:6px}
.lbox p{color:var(--muted);font-size:.9rem;margin-bottom:24px}
.err{color:#d6263b;font-size:.85rem;margin:-4px 0 12px;min-height:18px}

/* Fields */
.fld{margin-bottom:14px}
.fld label{display:block;font-size:.75rem;font-weight:600;color:var(--muted);margin-bottom:6px;letter-spacing:.03em}
.fld input,.fld textarea,.fld select{width:100%;background:var(--bg);border:1.5px solid transparent;border-radius:12px;padding:13px 14px;font:inherit;font-size:.95rem;outline:0;transition:border-color .25s,background .25s}
.fld input:focus,.fld textarea:focus,.fld select:focus{border-color:var(--ink);background:#fff}
.fld textarea{resize:vertical;min-height:80px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 24px;border-radius:50px;background:var(--ink);color:#fff;font-weight:600;font-size:.92rem;transition:transform .3s var(--ease),background .25s}
.btn:hover{background:var(--acc);transform:translateY(-2px)}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.5;pointer-events:none}
.btn.full{width:100%}
.btn.out{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.out:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.sm{padding:8px 16px;font-size:.8rem}
.btn.red{background:#fff;color:#d6263b;border:1.5px solid #f3c4ca}
.btn.red:hover{background:#d6263b;color:#fff}
.btn.wa{background:#25d366}

/* Layout */
header{display:flex;justify-content:space-between;align-items:center;padding:16px 4vw;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}
.logo{font-family:'Playfair Display',serif;font-weight:800;font-size:1.3rem}
.logo i{color:var(--acc);font-style:normal}
.logo small{font-family:'Inter';font-size:.7rem;background:var(--ink);color:#fff;padding:3px 9px;border-radius:50px;margin-left:8px;vertical-align:middle}
.tabs{display:flex;gap:8px;padding:20px 4vw 0}
.tab{padding:11px 24px;border-radius:50px;background:transparent;border:1.5px solid var(--line);font-weight:600;font-size:.9rem;color:var(--ink);transition:.25s}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tab b{background:var(--acc);color:#fff;border-radius:50px;padding:2px 8px;font-size:.72rem;margin-left:6px}
main{padding:22px 4vw 80px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:22px}
.stat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}
.stat span{color:var(--muted);font-size:.78rem}
.stat b{display:block;font-size:1.6rem;margin-top:4px;font-family:'Playfair Display',serif}

/* Products */
.pgrid{display:grid;grid-template-columns:minmax(300px,400px) 1fr;gap:22px;align-items:start}
@media(max-width:900px){.pgrid{grid-template-columns:1fr}}
.panel{background:#fff;border:1px solid var(--line);border-radius:24px;padding:24px}
.panel h2{font-size:1.4rem;margin-bottom:18px}
.drop{border:2px dashed var(--line);border-radius:18px;min-height:190px;display:grid;place-items:center;text-align:center;color:var(--muted);cursor:pointer;overflow:hidden;position:relative;transition:border-color .25s,background .25s;margin-bottom:14px}
.drop:hover,.drop.over{border-color:var(--acc);background:#fff6f2}
.drop img{width:100%;height:220px;object-fit:cover;display:block}
.drop .ph{padding:24px}
.drop .ph b{display:block;font-size:2rem}
.drop small{display:block;margin-top:6px;font-size:.78rem}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.pc{background:#fff;border:1px solid var(--line);border-radius:20px;padding:10px;animation:up .5s var(--ease)}
.pc .im{height:150px;border-radius:14px;background:var(--bg);overflow:hidden;display:grid;place-items:center;color:var(--muted);font-size:.8rem}
.pc .im img{width:100%;height:100%;object-fit:cover}
.pc h3{font-size:.95rem;margin:10px 4px 2px;font-weight:600}
.pc small{color:var(--muted);margin:0 4px;display:block;font-size:.76rem}
.pc .pr{margin:6px 4px 10px;font-weight:700}
.pc .pr s{color:var(--muted);font-weight:400;font-size:.78rem;margin-left:5px}
.pc .acts{display:flex;gap:8px;padding:0 4px 4px}
.pc .acts .btn{flex:1;padding:8px}
.empty{text-align:center;color:var(--muted);padding:50px 10px}

/* Orders */
.olist{display:grid;gap:14px}
.oc{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px;animation:up .5s var(--ease)}
.oh{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.oh b{font-size:1.05rem}
.oh small{color:var(--muted);display:block;font-size:.78rem}
.tag{padding:5px 13px;border-radius:50px;font-size:.75rem;font-weight:600;color:#fff}
.t-pending{background:var(--warn)}.t-confirmed{background:var(--blue)}.t-shipped{background:#7b3fe4}.t-delivered{background:var(--ok)}.t-cancelled{background:#8b8b93}
.ob{display:grid;grid-template-columns:1fr 1fr;gap:18px;font-size:.88rem;line-height:1.6}
@media(max-width:700px){.ob{grid-template-columns:1fr}}
.ob h4{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.it{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding:4px 0}
.of{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.of select{padding:9px 14px;border-radius:50px;border:1.5px solid var(--line);font:inherit;font-size:.85rem;background:#fff}
.of .tot{margin-left:auto;font-weight:700;font-size:1.1rem}

.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,120px);background:var(--ink);color:#fff;padding:13px 24px;border-radius:50px;z-index:400;transition:transform .5s var(--ease);font-size:.9rem;font-weight:500}
.toast.on{transform:translate(-50%,0)}
.toast.bad{background:#d6263b}
</style>
</head>
<body>

<!-- Login -->
<div id="login">
  <form class="lbox" id="lform">
    <h1>Admin Login</h1>
    <p>Rehan's Store — sirf owner ke liye.</p>
    <div class="fld"><label>EMAIL</label><input type="email" id="le" required autocomplete="username"></div>
    <div class="fld"><label>PASSWORD</label><input type="password" id="lp" required autocomplete="current-password"></div>
    <div class="err" id="lerr"></div>
    <button class="btn full" id="lbtn" type="submit">Login</button>
  </form>
</div>

<!-- App -->
<div id="app" class="hide">
  <header>
    <div class="logo">Rehan's<i>.</i>Store<small>ADMIN</small></div>
    <div style="display:flex;gap:10px"><a class="btn out sm" href="index.html" target="_blank">View store</a><button class="btn out sm" id="logout">Logout</button></div>
  </header>
  <div class="tabs">
    <button class="tab on" data-t="products">Products</button>
    <button class="tab" data-t="orders">Orders <b id="pendBadge" class="hide">0</b></button>
  </div>

  <main>
    <!-- Products -->
    <div id="tab-products">
      <div class="pgrid">
        <form class="panel" id="pform">
          <h2 id="ptitle">Add product</h2>
          <input type="hidden" id="pid">
          <div class="drop" id="drop"><div class="ph"><b>📷</b>Gallery se photo chunein<small>ya yahan drag karke chhor dein</small></div></div>
          <input type="file" id="file" accept="image/*" class="hide">
          <div class="fld"><label>PRODUCT NAME</label><input id="pn" required maxlength="80"></div>
          <div class="row2">
            <div class="fld"><label>PRICE (Rs)</label><input id="pp" type="number" min="0" required></div>
            <div class="fld"><label>OLD PRICE (optional)</label><input id="po" type="number" min="0"></div>
          </div>
          <div class="row2">
            <div class="fld"><label>CATEGORY</label><input id="pc" list="cats" required maxlength="30" placeholder="e.g. Audio"><datalist id="cats"></datalist></div>
            <div class="fld"><label>BADGE (optional)</label><input id="pb" list="badges" maxlength="14" placeholder="New / Hot / Sale"><datalist id="badges"><option>New</option><option>Hot</option><option>Sale</option><option>Best Seller</option></datalist></div>
          </div>
          <div class="fld"><label>DESCRIPTION</label><textarea id="pd" maxlength="200"></textarea></div>
          <div style="display:flex;gap:10px">
            <button class="btn full" id="psave" type="submit">Save product</button>
            <button class="btn out hide" id="pcancel" type="button">Cancel</button>
          </div>
        </form>
        <div>
          <div class="stats"><div class="stat"><span>Total products</span><b id="sP">0</b></div><div class="stat"><span>Categories</span><b id="sC">0</b></div></div>
          <div class="plist" id="plist"></div>
        </div>
      </div>
    </div>

    <!-- Orders -->
    <div id="tab-orders" class="hide">
      <div class="stats">
        <div class="stat"><span>Total orders</span><b id="oT">0</b></div>
        <div class="stat"><span>Pending</span><b id="oP">0</b></div>
        <div class="stat"><span>Delivered</span><b id="oD">0</b></div>
        <div class="stat"><span>Delivered revenue</span><b id="oR">Rs 0</b></div>
      </div>
      <div class="olist" id="olist"></div>
    </div>
  </main>
</div>
<div class="toast" id="toast"></div>

<script type="module">
const firebaseConfig = {
  apiKey: "AIzaSyDpy9pnXzD-UkVhewE9Ud6z5yXwc-EaM9o",
  authDomain: "rehans-store.firebaseapp.com",
  projectId: "rehans-store",
  storageBucket: "rehans-store.firebasestorage.app",
  messagingSenderId: "1091048404476",
  appId: "1:1091048404476:web:abdce6f446a25b02962e79"
};
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp(firebaseConfig), auth = getAuth(app), db = getFirestore(app);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => "Rs " + Number(n||0).toLocaleString("en-PK");
function toast(t, bad){ const el = $("#toast"); el.textContent = t; el.classList.toggle("bad", !!bad); el.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("on"), 2400); }

/* ---------- Auth ---------- */
$("#lform").onsubmit = async e => {
  e.preventDefault(); $("#lerr").textContent = ""; $("#lbtn").disabled = true;
  try { await signInWithEmailAndPassword(auth, $("#le").value.trim(), $("#lp").value); }
  catch(err){ $("#lerr").textContent = "Email ya password galat hai."; }
  $("#lbtn").disabled = false;
};
$("#logout").onclick = () => signOut(auth);
let unsubs = [];
onAuthStateChanged(auth, user => {
  unsubs.forEach(u => u()); unsubs = [];
  $("#login").classList.toggle("hide", !!user);
  $("#app").classList.toggle("hide", !user);
  if (user) startListeners();
});

/* ---------- Tabs ---------- */
document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x === t));
  $("#tab-products").classList.toggle("hide", t.dataset.t !== "products");
  $("#tab-orders").classList.toggle("hide", t.dataset.t !== "orders");
});

/* ---------- Image: gallery -> compressed JPEG ---------- */
let imgData = "";   // base64 of newly chosen image
let keepImg = "";   // existing image when editing
const drop = $("#drop"), file = $("#file");
drop.onclick = () => file.click();
file.onchange = () => file.files[0] && pick(file.files[0]);
["dragover","dragenter"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave","drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", e => e.dataTransfer.files[0] && pick(e.dataTransfer.files[0]));

function compress(f){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(f);
    img.onload = () => {
      let max = 900, q = .82, out;
      for (;;) {
        const s = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement("canvas"); c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
        const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
        out = c.toDataURL("image/jpeg", q);
        if (out.length < 300000 || max < 350) break;
        max -= 100; q = Math.max(.6, q - .04);
      }
      URL.revokeObjectURL(url); res(out);
    };
    img.onerror = () => rej(new Error("bad image")); img.src = url;
  });
}
async function pick(f){
  if (!f.type.startsWith("image/")) return toast("Sirf photo chunein", true);
  try { imgData = await compress(f); showPreview(imgData); }
  catch(e){ toast("Photo load nahi hui", true); }
}
function showPreview(src){
  drop.innerHTML = src ? `<img src="${src}" alt="">` : `<div class="ph"><b>📷</b>Gallery se photo chunein<small>ya yahan drag karke chhor dein</small></div>`;
}

/* ---------- Products ---------- */
let products = [];
function startListeners(){
  unsubs.push(onSnapshot(collection(db,"products"), snap => {
    products = snap.docs.map(d => ({id:d.id, ...d.data()})).sort((a,b) => (b.createdAt?.seconds||0) - (a.createdAt?.seconds||0));
    renderProducts();
  }, err => toast("Products load nahi huay: " + err.code, true)));
  unsubs.push(onSnapshot(query(collection(db,"orders"), orderBy("createdAt","desc")), snap => {
    orders = snap.docs.map(d => ({id:d.id, ...d.data()}));
    renderOrders();
  }, err => toast("Orders load nahi huay: " + err.code, true)));
}
function renderProducts(){
  const cats = [...new Set(products.map(p => p.category).filter(Boolean))];
  $("#sP").textContent = products.length; $("#sC").textContent = cats.length;
  $("#cats").innerHTML = cats.map(c => `<option value="${esc(c)}">`).join("");
  $("#plist").innerHTML = products.length ? products.map(p => `
    <div class="pc"><div class="im">${p.image ? `<img src="${esc(p.image)}" alt="">` : "No photo"}</div>
      <h3>${esc(p.name)}</h3><small>${esc(p.category)}${p.badge ? " · " + esc(p.badge) : ""}</small>
      <div class="pr">${fmt(p.price)}${p.oldPrice ? `<s>${fmt(p.oldPrice)}</s>` : ""}</div>
      <div class="acts"><button class="btn out sm" data-e="${p.id}">Edit</button><button class="btn red sm" data-d="${p.id}">Delete</button></div></div>`).join("")
    : `<div class="empty">Abhi koi product nahi. Left form se pehla product add karein.</div>`;
  document.querySelectorAll("[data-e]").forEach(b => b.onclick = () => editProduct(b.dataset.e));
  document.querySelectorAll("[data-d]").forEach(b => b.onclick = async () => {
    const p = products.find(x => x.id === b.dataset.d);
    if (!confirm(`"${p.name}" delete karna hai?`)) return;
    try { await deleteDoc(doc(db,"products",p.id)); toast("Product delete ho gaya"); } catch(e){ toast("Delete nahi hua: " + e.code, true); }
  });
}
function resetForm(){
  $("#pform").reset(); $("#pid").value = ""; imgData = ""; keepImg = ""; file.value = "";
  showPreview(""); $("#ptitle").textContent = "Add product"; $("#pcancel").classList.add("hide"); $("#psave").textContent = "Save product";
}
function editProduct(id){
  const p = products.find(x => x.id === id); if (!p) return;
  $("#pid").value = id; $("#pn").value = p.name||""; $("#pp").value = p.price??""; $("#po").value = p.oldPrice??"";
  $("#pc").value = p.category||""; $("#pb").value = p.badge||""; $("#pd").value = p.desc||"";
  imgData = ""; keepImg = p.image||""; showPreview(keepImg);
  $("#ptitle").textContent = "Edit product"; $("#psave").textContent = "Update product"; $("#pcancel").classList.remove("hide");
  scrollTo({top:0, behavior:"smooth"});
}
$("#pcancel").onclick = resetForm;
$("#pform").onsubmit = async e => {
  e.preventDefault();
  const btn = $("#psave"); btn.disabled = true;
  const data = {
    name: $("#pn").value.trim(), category: $("#pc").value.trim(), price: Number($("#pp").value),
    oldPrice: $("#po").value ? Number($("#po").value) : null, badge: $("#pb").value.trim(), desc: $("#pd").value.trim(),
    image: imgData || keepImg || ""
  };
  try {
    const id = $("#pid").value;
    if (id) { await updateDoc(doc(db,"products",id), data); toast("Product update ho gaya ✓"); }
    else { await addDoc(collection(db,"products"), {...data, createdAt: serverTimestamp()}); toast("Product add ho gaya ✓"); }
    resetForm();
  } catch(err){ console.error(err); toast("Save nahi hua: " + (err.code || err.message), true); }
  btn.disabled = false;
};

/* ---------- Orders ---------- */
let orders = [];
const STATUSES = ["pending","confirmed","shipped","delivered","cancelled"];
function waLink(phone, name, oid){
  let d = String(phone||"").replace(/\D/g,""); if (d.startsWith("0")) d = "92" + d.slice(1);
  return `https://wa.me/${d}?text=${encodeURIComponent(`Assalam o Alaikum ${name}, aap ka order ${oid} Rehan's Store se receive ho gaya hai.`)}`;
}
function renderOrders(){
  const pend = orders.filter(o => (o.status||"pending") === "pending").length;
  const del = orders.filter(o => o.status === "delivered");
  $("#oT").textContent = orders.length; $("#oP").textContent = pend; $("#oD").textContent = del.length;
  $("#oR").textContent = fmt(del.reduce((s,o) => s + Number(o.total||0), 0));
  const pb = $("#pendBadge"); pb.textContent = pend; pb.classList.toggle("hide", !pend);
  $("#olist").innerHTML = orders.length ? orders.map(o => {
    const st = o.status || "pending", when = o.createdAt?.toDate ? o.createdAt.toDate().toLocaleString("en-PK") : "";
    return `<div class="oc"><div class="oh"><div><b>${esc(o.orderId || o.id.slice(0,6).toUpperCase())}</b><small>${esc(when)}</small></div><span class="tag t-${esc(st)}">${esc(st)}</span></div>
      <div class="ob"><div><h4>Customer</h4>${esc(o.name)}<br>${esc(o.phone)}<br>${esc(o.city)}<br>${esc(o.address)}${o.note ? `<br><i>Note: ${esc(o.note)}</i>` : ""}</div>
      <div><h4>Items</h4>${(o.items||[]).map(i => `<div class="it"><span>${esc(i.name)} × ${esc(i.qty)}</span><span>${fmt(i.price*i.qty)}</span></div>`).join("")}</div></div>
      <div class="of"><select data-s="${o.id}">${STATUSES.map(s => `<option ${s===st?"selected":""}>${s}</option>`).join("")}</select>
        <a class="btn wa sm" href="${waLink(o.phone,o.name,o.orderId||"")}" target="_blank" rel="noopener">WhatsApp customer</a>
        <button class="btn red sm" data-od="${o.id}">Delete</button><span class="tot">${fmt(o.total)}</span></div></div>`;
  }).join("") : `<div class="empty">Abhi koi order nahi aaya.</div>`;
  document.querySelectorAll("[data-s]").forEach(s => s.onchange = async () => {
    try { await updateDoc(doc(db,"orders",s.dataset.s), {status:s.value}); toast("Status update ✓"); } catch(e){ toast("Update nahi hua: " + e.code, true); }
  });
  document.querySelectorAll("[data-od]").forEach(b => b.onclick = async () => {
    if (!confirm("Ye order delete karna hai?")) return;
    try { await deleteDoc(doc(db,"orders",b.dataset.od)); toast("Order delete ho gaya"); } catch(e){ toast("Delete nahi hua: " + e.code, true); }
  });
}
</script>
</body>
</html>
